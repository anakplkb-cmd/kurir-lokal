const T=n=>({
async list(f={}){if(MEM())return M[n].filter(r=>Object.keys(f).every(k=>r[k]==f[k])).sort((a,b)=>a.created_at<b.created_at?1:-1);
let q=sb.from(n).select('*');for(const k in f)q=q.eq(k,f[k]);const{data,error}=await q.order('created_at',{ascending:false});if(error)throw error;return data},
async ins(r,ret=1){if(MEM()){r={id:uid(),created_at:now(),...r};M[n].push(r);return r}
const q=sb.from(n).insert(r);if(!ret){const{error}=await q;if(error)throw error;return}const{data,error}=await q.select().single();if(error)throw error;return data},
async upd(id,p){if(MEM()){Object.assign(M[n].find(r=>r.id==id),p);return}if(n=='app_settings'){const{error}=await sb.from(n).upsert({id,...p});if(error)throw error;return}const{error}=await sb.from(n).update(p).eq('id',id);if(error)throw error},
async del(id){if(MEM()){M[n]=M[n].filter(r=>r.id!=id);return}const{error}=await sb.from(n).delete().eq('id',id);if(error)throw error}});

function gps(on){if(GW!=null){navigator.geolocation.clearWatch(GW);GW=null}if(!on||!navigator.geolocation)return;let t=0;
GW=navigator.geolocation.watchPosition(async p=>{if(Date.now()-t<1e4)return;t=Date.now();const u={last_lat:p.coords.latitude,last_lng:p.coords.longitude,last_seen:now()};Object.assign(S.user,u);try{await T('couriers').upd(S.user.id,u)}catch(_){}},()=>toast('Izinkan akses lokasi agar posisi terlihat pelanggan'),{enableHighAccuracy:true})}
